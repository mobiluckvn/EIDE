# CI — EIDE
#
# Thứ tự nền tảng theo PLATFORM.md: macOS trước (Intel và Apple Silicon đều BẮT BUỘC),
# rồi Windows, rồi Linux.
#
# VÌ SAO KHÔNG CÓ `macos-13`. PLATFORM.md viết khi runner `macos-13` (Intel) còn phục vụ;
# nó đã ngừng, và GitHub không còn runner Intel miễn phí. Bỏ trống phần Intel thì ma trận
# vẫn xanh cho một sản phẩm chưa ai chạy thử trên Intel — đúng cái bẫy mà
# `apps/geditor/scripts/build-universal.sh` mô tả: "không ai phát hiện phần x86_64 đã biến
# mất cho tới khi một người dùng Intel tải về".
#
# Nên phần Intel được phủ bằng Rosetta 2 trên chính runner arm64: cùng mã Python, nhưng
# `platform.machine()` trả `x86_64` và `which()` phải tìm ra Homebrew ở `/usr/local` thay vì
# `/opt/homebrew`. Đó chính là hai chỗ mã EIDE phân biệt kiến trúc (PLATFORM.md quy tắc 2, 5).
# Xem DEVIATIONS DEV-005.
name: ci
on: [push, pull_request]

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  runner: macos-14, python: "3.12" }
          - { arch: x86_64, runner: macos-14, python: "3.12" }   # qua Rosetta 2
    runs-on: ${{ matrix.runner }}
    name: mac-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      # Với arm64 thì `arch -arm64` là lệnh rỗng; với x86_64 nó bắt Rosetta vào cuộc. Đặt
      # tiền tố vào một biến để mọi bước dưới chạy cùng một đường, không rẽ nhánh `if`.
      - name: Chọn kiến trúc
        run: echo "ARCH_RUN=arch -${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Xác nhận kiến trúc thật
        run: |
          $ARCH_RUN python -c "import platform; print('máy:', platform.machine())"
          $ARCH_RUN python -c "import platform,sys; sys.exit(0 if platform.machine()=='${{ matrix.arch }}' else 1)"

      - run: $ARCH_RUN python -m pip install -e ".[dev]"
      - run: $ARCH_RUN python -m ruff check src tests scripts
      - run: $ARCH_RUN python scripts/validate_specs.py
      - run: $ARCH_RUN python -m pytest -m "not hardware"
      - run: $ARCH_RUN python -m eide.cli doctor || true
      - run: $ARCH_RUN python -m eide.cli caps list --ns tool
      # docs/spec/ là bản sinh từ docs/ho-so/nguon/ — sửa tay một bên là trôi khỏi bên kia
      - run: node scripts/gen_spec_tu_nguon.js --kiem
      - run: $ARCH_RUN python scripts/gen_rpc_swift.py --kiem
      - run: $ARCH_RUN python scripts/gen_ui_swift.py --kiem
      # UXC-31 §11.1/§11.2 — bảng theo dõi 25 màn là bản SINH, và luật "không tick nếu thiếu
      # bằng chứng" là một phép kiểm chứ không phải một câu trong tài liệu.
      - run: $ARCH_RUN python scripts/bang_theo_doi_man.py --kiem
      - run: $ARCH_RUN python scripts/kiem_checklist.py

  # Windows và Linux: thứ tự 2 và 3 trong PLATFORM.md — chạy để biết sớm, không chặn PR.
  khac:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: python scripts/validate_specs.py
      - run: python -m pytest -m "not hardware"
      - run: python -m eide.cli doctor || true

  # Giao diện mới (apps/eide) — UXC-31 §10.3: "toàn bộ 10 bài chạy trong CI trước mọi merge
  # nhánh giao diện; trượt 1 bài = chặn merge".
  #
  # Job này thiếu từ 18/09 tới 21/09: gói `apps/eide` ra đời trong kho mà CI không hề đụng tới,
  # nên 271 bài kiểm của nó chỉ chạy trên máy tôi. Một bộ kiểm không ai chạy ngoài tác giả là
  # một bộ kiểm hỏng vào đúng ngày tác giả quên chạy.
  #
  # KHÔNG `continue-on-error`: §10.3 nói thẳng "trượt 1 bài = chặn merge", và một cổng không
  # chặn được gì thì nó là một dòng log.
  eide-ui:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run: { working-directory: apps/eide }
    steps:
      - uses: actions/checkout@v4
      # `setup-python` chứ không dựa vào `python` sẵn có: runner macOS có `python3` nhưng KHÔNG
      # có `python` trần, nên mọi bước dưới sẽ hỏng ở dòng đầu tiên. Job `mac` phía trên đã dùng
      # đúng action này; bản đầu của job `eide-ui` quên nó.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: swift --version && xcodebuild -version
      # Token và mã RPC là BẢN SINH từ docs/spec — kiểm trước khi dựng, vì lệch ở đây làm mọi
      # bài kiểm dưới nói về một hợp đồng khác hợp đồng đang có hiệu lực.
      #
      # `.[dev]` cài luôn cả gói nền, nên `eide` có mặt trên PATH cho bước `--tu-kiem` bên dưới
      # — bài ấy chạy `eide project new` thật để dựng một dự án dùng một lần.
      - name: Bản sinh còn khớp docs/spec
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python scripts/gen_rpc_swift.py --kiem
          python scripts/gen_ui_swift.py --kiem
      - run: swift build
      - name: Bài kiểm đơn vị (§10.1 N1…N10)
        run: swift test
      # `--tu-kiem` đo trên CỬA SỔ THẬT: nó dựng một dự án dùng một lần trong thư mục tạm rồi
      # lái phiên qua từng bước. Đây là nhóm phép đo bắt được những chỗ `swift test` không thấy
      # — ràng buộc Auto Layout, `firstResponder`, cửa sổ tự phình ra.
      - name: Tự kiểm trên cửa sổ thật
        run: .build/debug/EideApp --tu-kiem

  # GEditor (Swift) — thành phần giao diện, nay nằm trong kho (DEVIATIONS DEV-004).
  # Chạy cổng khóa riêng TRƯỚC mọi thứ khác: rẻ nhất, và hỏng thì phải đổi khóa chứ không
  # phải sửa mã.
  geditor:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run: { working-directory: apps/geditor }
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - run: swift --version && xcodebuild -version
      - name: Không có khóa riêng trong kho (NFR-SEC-01)
        run: |
          ./scripts/check-no-secrets.sh --tu-kiem
          ./scripts/check-no-secrets.sh
      - name: libduckdb có đủ hai kiến trúc
        run: lipo -info vendor/duckdb/libduckdb.dylib
      - name: Lõi độc lập UI (NFR-MNT-01)
        run: ./scripts/check-core-no-ui.sh
      - name: Test lõi
        run: swift test
      # EIDEKit (WI-021): client JSON-RPC nói chuyện thật với `eide daemon`
      - name: EIDEKit ↔ daemon
        run: swift test --filter EIDEKitTests
