id: avr8
family_patterns: ["^ATmega", "^ATtiny", "^AVR(64|128)"]
abi: {endian: little, word: 8, fpu: none, align: 1}
interrupts: {model: vector_table, priority_bits: 0}
toolchain:
  compiler: {name: avr-gcc, min: "12.0", check: "avr-gcc --version"}
  tools: [{name: avrdude, min: "7.0"}, {name: avr-size, package: {macos: avr-gcc, linux: binutils-avr}}]
  install: {macos: ["brew tap osx-cross/avr && brew install avr-gcc avrdude"], linux: ["apt install gcc-avr avr-libc avrdude"], windows: ["winget install AVRDudes.AVRDUDE"]}
  build: {cmd: "make -C . MCU={mcu} F_CPU={f_cpu}", artifact: "build/*.elf"}
flash: {adapters: [avrdude, pymcuprog], default: avrdude, cmd: {avrdude: "avrdude -c {programmer} -p {part} -P {port} -U flash:w:{hex}:i"}, verify: true}
debug: {adapter: none, probes: [avrisp2, arduino]}
id_read: {method: signature, cmd: "avrdude -c {programmer} -p {part} -P {port} -v", regex: "signature = (0x[0-9a-f]+ 0x[0-9a-f]+ 0x[0-9a-f]+)", table: id_tables/avr.yaml}
serial: {default_baud: 115200, auto_baud_list: [9600, 19200, 38400, 57600, 115200]}
sim: {engine: simavr, fallback: qemu}
skills: [skills/avr8/timers.md, skills/avr8/twi.md]
