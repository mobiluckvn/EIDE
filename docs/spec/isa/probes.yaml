# Sinh từ EIDE-TGT-19 §4 "Bảng VID/PID probe và cổng". KHÔNG sửa tay.
# Nguồn: docs/ho-so/nguon/tgt_sim.js (mảng PROBES) — sinh lại bằng `node tgt_sim.js`.
probes:
  - id: stlink-v2
    name: "ST-Link V2"
    usb: ["0483:3748"]
    kind: swd
    tools: [probe-rs, openocd]
    driver_note: "macOS: không cần; Linux: udev 60-openocd; Windows: ST driver"
  - id: stlink-v2-1
    name: "ST-Link V2-1 / V3"
    usb: ["0483:374B", "0483:374E", "0483:374F", "0483:3753"]
    kind: swd+vcp
    tools: [probe-rs, openocd]
    driver_note: "VCP xuất hiện như tty.usbmodem"
  - id: jlink
    name: "J-Link"
    usb: ["1366:0101", "1366:0105", "1366:1015"]
    kind: swd/jtag
    tools: [probe-rs, openocd]
    driver_note: "Driver SEGGER trên Windows"
  - id: cmsis-dap
    name: "CMSIS-DAP (DAPLink, picoprobe)"
    usb: ["0D28:0204", "2E8A:000C"]
    kind: swd
    tools: [probe-rs]
    driver_note: "HID/bulk; không driver"
  - id: esp-usb-jtag
    name: "ESP USB-JTAG (ESP32-C3/S3)"
    usb: ["303A:1001"]
    kind: jtag+serial
    tools: [esptool, openocd]
    driver_note: "Linux udev"
  - id: cp210x
    name: "CP210x"
    usb: ["10C4:EA60"]
    kind: serial
    tools: []
    driver_note: "—"
  - id: ch340
    name: "CH340"
    usb: ["1A86:7523"]
    kind: serial
    tools: []
    driver_note: "Driver CH340 macOS cũ"
  - id: ftdi
    name: "FTDI"
    usb: ["0403:6001"]
    kind: serial
    tools: []
    driver_note: "—"
  - id: avrisp2
    name: "AVRISP mkII"
    usb: ["03EB:2104"]
    kind: isp
    tools: [avrdude]
    driver_note: "libusb"
  - id: arduino-uno
    name: "Arduino Uno (16U2)"
    usb: ["2341:0043"]
    kind: serial+bootloader
    tools: [avrdude]
    driver_note: "—"
  - id: pickit4
    name: "PICkit 4"
    usb: ["04D8:9012"]
    kind: icsp
    tools: [ipecmd]
    driver_note: "MPLAB"
