# defaults.yaml — giá trị mặc định cho PolicyGate khi dự án chưa có .eide/autonomy.yaml
# Nguồn: POL-17 §5 (schema autonomy.json, trường default), SDD-04 §6 (ví dụ autonomy.yaml).
#
# Bốn khóa danh sách trắng ở đây được NIÊM trong `defaults.sig` (POL-17 §3). Sửa tay một trong
# bốn khóa ấy mà không ký lại thì PolicyGate không nạp chúng nữa và mọi thứ rơi về ASK — đó là
# hành vi đúng, không phải hỏng. Ký lại bằng: eide policy sign
#
# `autonomy: A2` — Vũ Trí Công chọn ngày 2026-09-06, hạ từ A3. A2 nghĩa là tác tử tự làm tới
# lớp R2 (đọc, sinh mã, ghi dự án); mọi thao tác chạm phần cứng đều hỏi người. Xem DEV-001.
autonomy: A2
thresholds:
  fact_silver_auto: 0.85
  source_match_min: 0.7
  download_max_mb: 50
  plan_max_steps: 12
  plan_max_cost_usd: 1.0
  merge_size_growth_pct: 5
  flash_per_hour: 20
  bench_bc_min: 0.9
  fail_retries: 2
  budget_warn_pct: 20
# `raw.githubusercontent.com` thêm 11/09/2026 (WI-257). `github.com/cmsis-svd` mô tả nơi kho
# SVD tầng vàng ĐƯỢC TRÔNG THẤY, còn tệp thì phục vụ từ `raw.githubusercontent.com` — đúng tên
# miền mà `sources/vendors.yaml` khai trong `template` của cmsis-svd. G-SRC-01 khớp CHÍNH XÁC
# (`source.domain in trusted_sources`, không khớp hậu tố), nên trước hôm nay mọi lượt tải SVD
# tầng vàng đều rơi vào ASK: một cổng hỏi người về đúng thứ nó được dựng lên để cho qua.
trusted_sources: [st.com, microchip.com, nordicsemi.com, espressif.com, bosch-sensortec.com, github.com/cmsis-svd, raw.githubusercontent.com]
# Danh sách mặc định của TGT-19 §3, đủ 24 gói (trước 11/09/2026 tệp này chỉ có 12 — đúng một
# nửa, nên `env.install cmake` hay `env.install cppcheck` đều rơi vào ASK dù tài liệu ghi chúng
# là gói tin cậy). Cộng hai tên của chuỗi công cụ ARM trên Homebrew: `gcc-arm-none-eabi` là tên
# gói của **apt**, còn Homebrew — và `toolchain.compiler.name` của `isa/armv7e-m.yaml` — dùng
# `arm-none-eabi-gcc`. Một danh sách phẳng dùng chung cho ba trình quản lý gói thì phải kể cả
# ba cách đặt tên, nếu không nền tảng nào không được kể sẽ trượt trong im lặng. Xem DEV-089.
# MỘT DÒNG, không xuống dòng: bộ đọc YAML của GEditor chưa hiểu dãy flow trải nhiều dòng, và
# `YAMLRealFilesTests` chạy trên chính tệp này. Bản nháp đầu viết ba dòng cho dễ đọc và làm bài
# ấy đỏ ngay — đúng việc nó sinh ra để làm. Mọi danh sách khác trong tệp cũng một dòng.
trusted_packages: [gcc-arm-none-eabi, arm-none-eabi-gcc, arm-none-eabi-binutils, avr-gcc, avrdude, riscv-none-elf-gcc, riscv64-elf-gcc, riscv64-elf-binutils, esp-idf, cmake, ninja, probe-rs, openocd, esptool, pymcuprog, picotool, renode, simavr, qemu, cppcheck, clang-tidy, mermaid-cli, plantuml, graphviz, d2, wavedrom-cli, sigrok-cli, docling]
allowed_licenses: [MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, CC-BY-4.0, vendor-doc]
# Danh sách thứ tư mà POL-17 §3 gọi là `lab_boards` nhưng §4 đặt tên `boards` (DEV-030).
# Để RỖNG có chủ ý: đánh dấu board lab đòi người xác nhận hai điều mà chỉ người cầm board mới
# biết — không có cơ cấu chấp hành nguy hiểm, và nguồn có giới hạn dòng (POL-17 §3). Ở mức A2
# hiện tại thì mục này chưa đổi gì cả: thao tác R3 đã bị ngưỡng cứng ép hỏi người trước khi
# G-OPS được hỏi tới. Nó chỉ có tác dụng nếu sau này nâng lên A3.
boards: {}
undo_window: {facts: 72h, merge: 24h, flash: session, files: 24h}
ask_timeout_s: 120
defaults: {project_dir: "~/eide", model_profile: default, sim_first: true, diagram_lang: mermaid, doc_lang: vi, create_when_exists: ask}
escalation: {channels: [queue, chat, notify]}
sensitive: false
