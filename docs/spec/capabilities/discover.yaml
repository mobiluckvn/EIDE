- code: DISCOVER-05
  id: discover.bus_scan
  name: Quét bus I2C/SPI/1-Wire/CAN tìm thiết bị đang có; đối chiếu địa chỉ với BOM
  desc: Quét bus I2C/SPI/1-Wire/CAN tìm thiết bị đang có; đối chiếu địa chỉ với BOM
  input:
    type: object
    properties:
      bus:
        type: string
        enum:
        - i2c
        - spi
        - onewire
        - can
      target:
        type: string
    required:
    - bus
    - target
    additionalProperties: false
  output:
    type: object
    properties:
      devices:
        type: array
        items:
          type: object
        description: addr|id, matched_part
    required:
    - devices
    additionalProperties: false
  risk: R1
  tier: T1
  grounding:
  - Board lab
  ask_when:
  - Board không lab
  undo:
    kind: reflash_known_good
  milestone: M3
  impl: eide.discover:bus_scan
  errors:
  - E3000
  - E4002
  example:
    bus: i2c
    target: nucleo-f411
