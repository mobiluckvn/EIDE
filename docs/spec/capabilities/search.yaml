- code: SEARCH-01
  id: search.registry
  name: Tìm gói/hộ chiếu/mẫu tham chiếu trong registry
  desc: Tìm gói/hộ chiếu/mẫu tham chiếu trong registry
  input:
    type: object
    properties:
      query:
        type: string
      kind:
        type: string
        enum:
        - passport
        - skill
        - template
        - any
    required:
    - query
    additionalProperties: false
  output:
    type: object
    properties:
      candidates:
        type: array
        items:
          type: object
        description: id@ver, kind, badges, score
    required:
    - candidates
    additionalProperties: false
  risk: R0
  tier: T1
  grounding: []
  ask_when: []
  undo:
    kind: none
  milestone: M4
  impl: eide.search:registry
  errors:
  - E4004 registry không tới được → trả rỗng + cảnh báo
  example:
    query: stm32f411
    kind: passport
