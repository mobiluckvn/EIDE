- code: SEARCH-06
  id: search.fetch
  name: Tải ứng viên (giới hạn dung lượng), hash, phát hiện license
  desc: Tải ứng viên (giới hạn dung lượng), hash, phát hiện license
  input:
    type: object
    properties:
      candidate:
        type: object
    required:
    - candidate
    additionalProperties: false
  output:
    type: object
    properties:
      source_id:
        type: string
      sha256:
        type: string
      license:
        type: string
      size_bytes:
        type: integer
    required:
    - source_id
    - sha256
    - license
    - size_bytes
    additionalProperties: false
  risk: R1
  tier: T1
  grounding:
  - Theo chính sách G-SRC
  ask_when:
  - Ngoài danh sách tin cậy; license không rõ; tệp lớn
  undo:
    kind: delete_created_files
  milestone: M1
  impl: eide.search:fetch
  errors:
  - E3000 pending
  - E3001
  - E8001
  - E4004
  example:
    candidate:
      uri: https://www.st.com/…/rm0383.pdf
      domain: st.com
      kind: pdf_vendor
      size_mb: 12
