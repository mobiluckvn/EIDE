- code: SIM-01
  id: sim.build_platform
  name: Sinh mô tả nền tảng (Renode .repl / simavr / tự xây) từ hộ chiếu
  desc: Sinh mô tả nền tảng (Renode .repl / simavr / tự xây) từ hộ chiếu
  input:
    type: object
    properties:
      chip:
        type: string
      board:
        type: string
    required:
    - chip
    additionalProperties: false
  output:
    type: object
    properties:
      platform_dir:
        type: string
      engine:
        type: string
        enum:
        - renode
        - simavr
        - qemu
        - native
      coverage:
        type: object
    required:
    - platform_dir
    - engine
    - coverage
    additionalProperties: false
  risk: R1
  tier: T1
  grounding:
  - Hộ chiếu vàng
  ask_when:
  - Chip không có trong Renode
  undo:
    kind: delete_created_files
  milestone: M3
  impl: eide.sim:build_platform
  errors:
  - E4001 thiếu engine
  example:
    chip: st.stm32f411ce
    board: blackpill-f411
