- code: DIAGRAM-01
  id: diagram.render
  name: Vẽ lược đồ từ ngôn ngữ GEditor đã hỗ trợ (Mermaid, PlantUML, Graphviz/DOT, D2, W
  desc: Vẽ lược đồ từ ngôn ngữ GEditor đã hỗ trợ (Mermaid, PlantUML, Graphviz/DOT, D2, WaveDrom, SVG); xem trong GEditor
  input:
    type: object
    properties:
      src:
        type: string
      lang:
        type: string
        enum:
        - mermaid
        - plantuml
        - dot
        - d2
        - wavedrom
        - svg
      fmt:
        type: string
        enum:
        - svg
        - png
    required:
    - src
    - lang
    additionalProperties: false
  output:
    type: object
    properties:
      path:
        type: string
      lint:
        type: array
        items:
          type: object
    required:
    - path
    - lint
    additionalProperties: false
  risk: R0
  tier: T1
  grounding: []
  ask_when: []
  undo:
    kind: delete_created_files
  milestone: M1
  impl: eide.diagram:render
  errors:
  - E4001 thiếu renderer → env.install
  - E4000 cú pháp
  example:
    src: graph TD; A-->B
    lang: mermaid
    fmt: svg
