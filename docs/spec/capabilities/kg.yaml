- code: KG-05
  id: kg.review_facts
  name: Duyệt fact theo nhóm (tự theo chính sách hoặc người)
  desc: Duyệt fact theo nhóm (tự theo chính sách hoặc người)
  input:
    type: object
    properties:
      group:
        type: string
        description: batch_id|subject prefix|status
      decision:
        type: string
        enum:
        - accept
        - reject
        - policy
      actor:
        type: string
    required:
    - group
    - actor
    additionalProperties: false
  output:
    type: object
    properties:
      reviewed:
        type: integer
      asked:
        type: integer
      rejected:
        type: integer
        description: nhánh REJECT của G-FACT (ví dụ tầng đồng)
    required:
    - reviewed
    - asked
    - rejected
    additionalProperties: false
  risk: R1
  tier: T1*
  grounding: []
  ask_when:
  - confidence thấp; mâu thuẫn
  undo:
    kind: supersede_facts
  milestone: M1
  impl: eide.kg:review_facts
  errors:
  - E3000
  example:
    group: batch:b_12
    decision: policy
    actor: policy
