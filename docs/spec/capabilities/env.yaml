- code: ENV-07
  id: env.sandbox
  name: Chạy extractor/lệnh trong sandbox giới hạn CPU/RAM/thời gian/đường dẫn
  desc: Chạy extractor/lệnh trong sandbox giới hạn CPU/RAM/thời gian/đường dẫn
  input:
    type: object
    properties:
      cmd:
        type: array
        items:
          type: string
      limits:
        type: object
      allowed_dirs:
        type: array
        items:
          type: string
      network:
        type: boolean
    required:
    - cmd
    additionalProperties: false
  output:
    type: object
    properties:
      exit_code:
        type: integer
      stdout_ref:
        type: string
      stderr_ref:
        type: string
      violations:
        type: array
        items:
          type: string
    required:
    - exit_code
    - stdout_ref
    - stderr_ref
    - violations
    additionalProperties: false
  risk: R1
  tier: T1
  grounding: []
  ask_when: []
  undo:
    kind: none
  milestone: M1
  impl: eide.env:sandbox
  errors:
  - E8000
  - E4004
  example:
    cmd:
    - docling
    - ds.pdf
    limits:
      wall_s: 300
