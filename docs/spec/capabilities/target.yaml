- code: TARGET-02
  id: target.flash
  name: Nạp + verify qua adapter ISA
  desc: Nạp + verify qua adapter ISA
  input:
    type: object
    properties:
      artifact:
        type: string
      target:
        type: string
      verify:
        type: boolean
    required:
    - artifact
    - target
    additionalProperties: false
  output:
    type: object
    properties:
      report:
        type: object
    required:
    - report
    additionalProperties: false
  risk: R3
  tier: T1*
  grounding:
  - Board lab; artifact qua G3
  ask_when:
  - Board không lab; động cơ
  undo:
    kind: reflash_known_good
  milestone: M2
  impl: eide.target:flash
  errors:
  - E3000
  - E4002
  - E4003
  - E4000
  example:
    artifact: build/fw.elf
    target: nucleo-f411
