- code: TARGET-04
  id: target.serial
  name: Mở/đọc/ghi/expect serial đa cổng; ghi JSONL
  desc: Mở/đọc/ghi/expect serial đa cổng; ghi JSONL
  input:
    type: object
    properties:
      port:
        type: string
      op:
        type: string
        enum:
        - open
        - close
        - read
        - write
        - expect
      baud:
        type: integer
      data:
        type: string
      pattern:
        type: string
      timeout_s:
        type: number
    required:
    - port
    - op
    additionalProperties: false
  output:
    type: object
    properties:
      lines:
        type: array
        items:
          type: object
      matched:
        type: boolean
    required:
    - lines
    additionalProperties: false
  risk: R0
  tier: T1
  grounding: []
  ask_when: []
  undo:
    kind: none
  milestone: M2
  impl: eide.target:serial
  errors:
  - E4002
  - E4004
  example:
    port: /dev/tty.usbmodem1
    op: expect
    pattern: BME280 ok
    timeout_s: 5
- code: TARGET-05
  id: target.probe_read
  name: halt/step/read_memory/read_registers/breakpoint (đọc)
  desc: halt/step/read_memory/read_registers/breakpoint (đọc)
  input:
    type: object
    properties:
      op:
        type: string
        enum:
        - halt
        - run
        - step
        - read_memory
        - read_registers
        - set_breakpoint
        - clear_breakpoint
      addr:
        type: string
      len:
        type: integer
      target:
        type: string
    required:
    - op
    - target
    additionalProperties: false
  output:
    type: object
    properties:
      evidence:
        type: object
        description: EvidencePack
    required:
    - evidence
    additionalProperties: false
  risk: R0
  tier: T1
  grounding:
  - Probe
  ask_when: []
  undo:
    kind: none
  milestone: M3
  impl: eide.target:probe_read
  errors:
  - E4002
  - E4004
  example:
    op: read_memory
    addr: '0x40005400'
    len: 16
    target: nucleo-f411
