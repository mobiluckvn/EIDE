- code: TARGET-09
  id: target.observe
  name: Chạy kỳ vọng quan sát bằng máy (serial expect, probe, LA, camera)
  desc: Chạy kỳ vọng quan sát bằng máy (serial expect, probe, LA, camera)
  input:
    type: object
    properties:
      expect:
        type: array
        items:
          type: object
        description: kind serial|probe|logic|current|camera, spec
      target:
        type: string
    required:
    - expect
    - target
    additionalProperties: false
  output:
    type: object
    properties:
      evidence:
        type: array
        items:
          type: object
      all_passed:
        type: boolean
      machine_observable:
        type: boolean
    required:
    - evidence
    - all_passed
    - machine_observable
    additionalProperties: false
  risk: R0
  tier: T1
  grounding: []
  ask_when:
  - Cần mắt/tay người
  undo:
    kind: none
  milestone: M2
  impl: eide.target:observe
  errors:
  - E3000
  - E4002
  example:
    expect:
    - kind: serial
      spec:
        pattern: T=2[0-9]\.
    target: nucleo-f411
