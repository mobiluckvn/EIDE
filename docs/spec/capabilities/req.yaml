- code: REQ-01
  id: req.elicit
  name: Thu thập yêu cầu từ lệnh NL, tài liệu, ảnh, chat cũ; sinh câu hỏi gộp cho ô trốn
  desc: Thu thập yêu cầu từ lệnh NL, tài liệu, ảnh, chat cũ; sinh câu hỏi gộp cho ô trống
  input:
    type: object
    properties:
      text:
        type: string
      sources:
        type: array
        items:
          type: string
        description: README, tài liệu, ảnh, chat ids
      feature:
        type: string
    required: []
    additionalProperties: false
  output:
    type: object
    properties:
      raw:
        type: array
        items:
          type: object
        description: text, source, locator, kind_guess
      gaps:
        type: array
        items:
          type: object
    required:
    - raw
    - gaps
    additionalProperties: false
  risk: R0
  tier: T1
  grounding: []
  ask_when:
  - Ô trống không có mặc định
  undo:
    kind: none
  milestone: M1
  impl: eide.req:elicit
  errors:
  - E5002
  example:
    sources:
    - README.md
    text: robot cân bằng, pin 12 V, chạy 30 phút
