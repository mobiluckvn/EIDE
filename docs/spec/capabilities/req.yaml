- code: REQ-03
  id: req.ground_hw
  name: 'Đối chiếu yêu cầu với hộ chiếu chip/board (chân, ngoại vi, RAM/Flash, tần số) → '
  desc: Đối chiếu yêu cầu với hộ chiếu chip/board (chân, ngoại vi, RAM/Flash, tần số) → khả thi/không
  input:
    type: object
    properties:
      reqset_ids:
        type: array
        items:
          type: string
      passport:
        type: string
    required:
    - reqset_ids
    - passport
    additionalProperties: false
  output:
    type: object
    properties:
      report:
        type: array
        items:
          type: object
        description: req_id, ok, facts[], note, alternative
    required:
    - report
    additionalProperties: false
  risk: R0
  tier: T1
  grounding:
  - Có hộ chiếu
  ask_when:
  - Không khả thi trên board đã chọn
  undo:
    kind: none
  milestone: M1
  impl: eide.req:ground_hw
  errors: []
  example:
    reqset_ids:
    - FR-SNS-01
    passport: st.stm32f411ce@1.2
