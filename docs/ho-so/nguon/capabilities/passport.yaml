- code: PASSPORT-01
  id: passport.import
  name: Ghi FactBatch qua cổng ghi duy nhất (merge tier, conflict, ledger)
  desc: Ghi FactBatch qua cổng ghi duy nhất (merge tier, conflict, ledger)
  input:
    type: object
    properties:
      batch:
        type: object
        description: FactBatch
      actor:
        type: string
    required:
    - batch
    - actor
    additionalProperties: false
  output:
    type: object
    properties:
      written:
        type: integer
      merged:
        type: integer
      conflicts:
        type: integer
      batch_id:
        type: string
    required:
    - written
    - merged
    - conflicts
    - batch_id
    additionalProperties: false
  risk: R1
  tier: T1
  grounding: []
  ask_when: []
  undo:
    kind: supersede_facts
  milestone: M0
  impl: eide.passport:import
  errors:
  - E6001
  - E6000
  example:
    batch:
      facts: []
    actor: extract.svd
- code: PASSPORT-02
  id: passport.query
  name: Tra fact theo part/periph/reg/field hoặc câu hỏi NL; kèm trích dẫn/tầng/trạng th
  desc: Tra fact theo part/periph/reg/field hoặc câu hỏi NL; kèm trích dẫn/tầng/trạng thái
  input:
    type: object
    properties:
      part:
        type: string
      peripheral:
        type: string
      register:
        type: string
      field:
        type: string
      q:
        type: string
        description: câu hỏi NL
      include_history:
        type: boolean
    required: []
    additionalProperties: false
  output:
    type: object
    properties:
      facts:
        type: array
        items:
          type: object
      citations:
        type: array
        items:
          type: object
      tiers:
        type: object
      latency_ms:
        type: integer
    required:
    - facts
    - citations
    - tiers
    - latency_ms
    additionalProperties: false
  risk: R0
  tier: T1
  grounding: []
  ask_when: []
  undo:
    kind: none
  milestone: M0
  impl: eide.passport:query
  errors: []
  example:
    part: st.stm32f411ce
    peripheral: I2C1
    register: CR1
