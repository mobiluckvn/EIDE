- code: MEASURE-01
  id: measure.capture_signal
  name: 'sigrok: bắt và decode I2C/SPI/UART'
  desc: 'sigrok: bắt và decode I2C/SPI/UART'
  input:
    type: object
    properties:
      channels:
        type: array
        items:
          type: string
      duration_s:
        type: number
      decoder:
        type: string
        enum:
        - i2c
        - spi
        - uart
        - none
    required:
    - channels
    - duration_s
    additionalProperties: false
  output:
    type: object
    properties:
      dataset_id:
        type: string
      decoded:
        type: array
        items:
          type: object
    required:
    - dataset_id
    - decoded
    additionalProperties: false
  risk: R0
  tier: T1
  grounding:
  - LA nối
  ask_when: []
  undo:
    kind: none
  milestone: M5
  impl: eide.measure:capture_signal
  errors:
  - E4001
  - E4002
  example:
    channels:
    - D0
    - D1
    duration_s: 2
    decoder: i2c
