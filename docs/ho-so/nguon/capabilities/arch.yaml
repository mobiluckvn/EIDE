- code: ARCH-01
  id: arch.style_select
  name: 'Chọn kiểu kiến trúc firmware (super-loop, event-driven, RTOS, layered/HAL) theo '
  desc: Chọn kiểu kiến trúc firmware (super-loop, event-driven, RTOS, layered/HAL) theo yêu cầu và tài nguyên chip
  input:
    type: object
    properties:
      reqset_ids:
        type: array
        items:
          type: string
      passport:
        type: string
    required:
    - reqset_ids
    - passport
    additionalProperties: false
  output:
    type: object
    properties:
      decision:
        type: object
        description: style, reasons[], facts[], alternatives[]
    required:
    - decision
    additionalProperties: false
  risk: R1
  tier: T1*
  grounding:
  - Hộ chiếu + NFR
  ask_when:
  - Đổi kiểu kiến trúc dự án đã có
  undo:
    kind: restore_config
  milestone: M2
  impl: eide.arch:style_select
  errors:
  - E3000
  - E5002
  example:
    reqset_ids: []
    passport: st.stm32f411ce@1.2
