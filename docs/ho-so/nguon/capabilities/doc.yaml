- code: DOC-01
  id: doc.generate
  name: Sinh tài liệu theo chuẩn bộ EAA/EIDE (URD, SRS, SAD, SDD, STP, BPD…) từ tri thức
  desc: Sinh tài liệu theo chuẩn bộ EAA/EIDE (URD, SRS, SAD, SDD, STP, BPD…) từ tri thức dự án; thuộc tính, lịch sử, mục Nguồn
  input:
    type: object
    properties:
      type:
        type: string
        enum:
        - URD
        - SRS
        - SAD
        - SDD
        - STP
        - BPD
        - bringup
        - test_report
        - custom
      scope:
        type: string
      lang:
        type: string
        enum:
        - vi
        - en
    required:
    - type
    additionalProperties: false
  output:
    type: object
    properties:
      doc_id:
        type: string
      path:
        type: string
      style_issues:
        type: integer
    required:
    - doc_id
    - path
    - style_issues
    additionalProperties: false
  risk: R1
  tier: T1
  grounding:
  - Fact có nguồn
  ask_when:
  - Thiếu fact bắt buộc
  undo:
    kind: delete_created_files
  milestone: M2
  impl: eide.doc:generate
  errors:
  - E5002
  - E3000 thiếu fact bắt buộc
  example:
    type: SRS
    lang: vi
