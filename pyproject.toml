[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eide"
version = "0.1.0"
description = "EIDE — Embedded IDE có tác tử: Knowledge Plane, PolicyGate, registry năng lực (Đề án ThS Kỹ thuật Điện tử, PTIT)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Vũ Trí Công", email = "vutricongbka@gmail.com" }]
dependencies = [
  "pyyaml>=6.0",            # capabilities/*.yaml, policy/*.yaml
  "jsonschema>=4.17",       # kiểm input/output theo cds.json (API-15 E1000)
  "platformdirs>=3.0",      # thư mục cấu hình/cache đa nền tảng (PLATFORM.md)
  "openpyxl>=3.1",          # req.trace_matrix format=xlsx (CDS-12.1 REQ-06); import trễ
  # Nhóm extract.* (CDS-12.2). Cả hai đều import TRỄ: ai không đụng PDF/docx không phải trả giá.
  "pdfplumber>=0.11",       # extract.pdf_layout — hợp đồng ghi "Docling (fallback pdfplumber)".
                            # Docling KHÔNG khai ở đây: nó kéo theo PyTorch (~2 GB) cho một việc
                            # mà pdfplumber làm đủ tốt, và EXTRACT-05 đã lường trước bằng E4001
                            # "thiếu docling". Có docling trong môi trường thì dùng, không thì
                            # pdfplumber — người dùng chọn, không phải cài đặt bắt buộc.
  "python-docx>=1.1",       # extract.office — docx; xlsx đã có openpyxl
  # Ghim TRẦN có lý do nền tảng, không phải sở thích. `pdfminer.six` (qua pdfplumber) cần
  # `cryptography`; từ bản 44 trở đi PyPI không còn bánh xe x86_64 cho macOS, nên pip DỊCH TỪ
  # NGUỒN — và phần Rust dưới Rosetta vẫn sinh mã arm64, tạo ra một `.so` arm64 nằm trong venv
  # x86 rồi hỏng lúc import. Bản < 44 phát hành bánh xe universal2 nên chạy cả hai kiến trúc.
  # Bỏ trần này thì `make check-ca-hai` gãy ở nhánh Intel (PLATFORM.md §ma trận).
  "cryptography<44",
]
# CLI dùng argparse (stdlib) — ít phụ thuộc, chạy ngay trên ba nền tảng. pydantic thêm ở Sprint 2 khi có DDD store.

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "openpyxl>=3.1"]
hardware = ["pyserial>=3.5", "pyusb>=1.2"]
llm = ["anthropic>=0.30", "google-genai>=1.0"]

[project.scripts]
eide = "eide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eide", "src/eide_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: cần board/probe thật — bỏ qua trên CI",
  # DEP-26 §5: job `dialog` gọi mô hình THẬT chạy ban đêm với khóa từ secrets. Test hằng ngày
  # dùng EchoPort (job `contract`), nên `make check` loại nhóm này ra: nó tốn tiền và cần mạng.
  "llm: gọi mô hình thật — cần khóa API, bỏ qua trong make check",
  # Mẫu URL hãng (TGT-19 §8) và bộ dựng lược đồ chỉ đúng nếu ĐỜI THẬT còn như tài liệu mô tả.
  # Giả lập không bắt được: một mẫu URL sai vẫn trông hoàn toàn hợp lý trong YAML, và một thứ
  # tự tham số subprocess sai cũng vậy. Đo được rồi: 4/11 mẫu sai lúc kiểm lần đầu.
  # Không vào `make check` vì cần mạng và vì máy chủ hãng có lúc chặn/hết giờ — một test đỏ vì
  # st.com giới hạn tần suất là test người ta học cách bỏ qua.
  "net: gọi mạng thật (không cần khóa) — chạy bằng `make check-net`",
]
addopts = "-q -m 'not llm and not net'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH"]   # PTH: bắt buộc pathlib (PLATFORM.md quy tắc 1)
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
