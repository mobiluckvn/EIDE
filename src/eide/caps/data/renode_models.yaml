# renode_models.yaml — ngoại vi của chip → mô hình sẵn có trong Renode.
#
# Nguồn: EIDE-SIM-20 §2 nhắc đích danh tệp này ("bảng renode_models.yaml theo họ") và liệt kê
# năm ánh xạ đầu tiên: I2C→ I2C.STM32F4_I2C, USART→ UART.STM32_UART, GPIO→ GPIOPort.STM32_GPIOPort,
# TIM→ Timers.STM32_Timer, RCC→ Miscellaneous.STM32F4_RCC.
#
# Vì sao tệp nằm ở `src/` chứ không ở `docs/spec/`: `docs/spec/` được SINH RA từ
# `docs/ho-so/nguon/` và không được sửa tay (CLAUDE.md §4), mà không bộ sinh nào phát ra bảng
# này — SIM-20 chỉ nêu tên tệp trong văn xuôi. Xem DEVIATIONS DEV-082.
#
# Nguyên tắc đọc bảng: ngoại vi KHÔNG khớp mẫu nào thì vào `coverage.unsupported`, KHÔNG đoán
# một mô hình gần giống. Một ngoại vi gắn nhầm mô hình chạy được và trả số sai; một ngoại vi
# thiếu mô hình thì firmware treo ở chỗ đọc thanh ghi đầu tiên — và treo ở chỗ đúng còn hơn
# chạy ra số sai.

version: 1

families:
  # Họ chip → tiền tố tên ngoại vi (khớp đầu tên, không phân biệt hoa thường) → mô hình Renode.
  stm32f4:
    match: ["^STM32F4"]
    cpu: CPU.CortexM
    nvic: {model: IRQControllers.NVIC, base: 0xE000E000}
    peripherals:
      I2C:    {model: I2C.STM32F4_I2C, kind: bus}
      USART:  {model: UART.STM32_UART, kind: uart}
      UART:   {model: UART.STM32_UART, kind: uart}
      SPI:    {model: SPI.STM32SPI, kind: bus}
      GPIO:   {model: GPIOPort.STM32_GPIOPort, kind: gpio}
      TIM:    {model: Timers.STM32_Timer, kind: timer}
      RCC:    {model: Miscellaneous.STM32F4_RCC, kind: clock}
      PWR:    {model: Miscellaneous.STM32F4_PWR, kind: clock}
      DMA:    {model: DMA.STM32DMA, kind: dma}
      ADC:    {model: Analog.STM32_ADC, kind: analog}
      EXTI:   {model: IRQControllers.STM32F4_EXTI, kind: irq}
      RTC:    {model: Timers.STM32F4_RTC, kind: timer}
      IWDG:   {model: Timers.STM32_IndependentWatchdog, kind: timer}

  # Họ AVR không dùng Renode (SIM-20 §1 bảng chế độ: AVR8 → simavr), nên bảng chỉ ghi CPU để
  # `sim.build_platform` báo đúng lý do thay vì im lặng trả bảng rỗng.
  avr8:
    match: ["^ATmega", "^ATtiny"]
    cpu: null
    peripherals: {}
